services:
  mysql:
    hostname: talentyar_mysql
    image : mysql:8
    container_name : talentyar_mysql
    restart: unless-stopped
    env_file: ./Docker/mysql/.env
    ports:
      - "127.0.0.1:3313:3306"
    volumes :
      - "./Docker/data/mysql/talentyar:/var/lib/mysql"
      - "./Docker/data/mysql/backup:/data/backups"
    networks:
      - talentyar_network
  php :
    hostname: talentyar_php
    build : ./Docker/php
    container_name : talentyar_php
    restart: unless-stopped
    ports:
      - "9202:9001"
    volumes :
      - "./:/var/www/talentyar"
      - "./Docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini"
    networks:
      - talentyar_network
  nginx :
    hostname : talentyar_nginx
    build : ./Docker/nginx
    container_name : talentyar_nginx
    restart : always
    ports :
      - "8042:81"
    volumes :
      - "./Docker/nginx/conf.d:/etc/nginx/conf.d/"
      - "./:/var/www/talentyar"
    links:
      - php
    networks :
      - talentyar_network
networks:
    talentyar_network:
        driver: bridge
